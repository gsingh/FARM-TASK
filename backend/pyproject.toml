[project]
name = "farm-task-backend"
version = "0.1.0"
description = "Farm-Task backend API"
requires-python = ">=3.9"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]",
    "sqlalchemy>=2.0",
    "aiosqlite",
    "greenlet",
    "alembic",
    "pydantic-settings",
]

[project.optional-dependencies]
dev = [
    "ruff",
    "pytest>=8.0",
    "pytest-asyncio",
    "httpx",
    "mypy",
]

[tool.setuptools.packages.find]
include = ["app*"]

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"
